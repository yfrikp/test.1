# =============================================================================
#  题目1 参数文件 —— 你主要要改的就是这个文件
#
#  用法：
#    ros2 run vision_task1 color_detector --ros-args \
#        --params-file $(ros2 pkg prefix vision_task1)/share/vision_task1/config/params.yaml
#
#  或者改动少的时候直接命令行覆盖：
#    ros2 run vision_task1 color_detector --ros-args -p real_edge_m:=0.06
# =============================================================================
color_detector:
  ros__parameters:

    # -------------------------------------------------------------------------
    #  【必须你实测填写】物块真实边长，单位米
    #  方法：拿尺子量红蓝方块的边长，把米数填这里。
    #  这个值直接决定距离和长度的绝对精度 —— 填错了所有数据都错。
    #  题目图片里的方块看起来像 5cm 左右，先按 0.05 试，然后实测校正。
    # -------------------------------------------------------------------------
    real_edge_m: 0.05

    # -------------------------------------------------------------------------
    #  【加分项】参照点与相机光心的偏移，单位米
    #  题目原文：「如果我的参照点与摄像头的中心有一定的偏移，
    #             程序能够通过调整偏移量实现精准的定位」
    #  保持 0.0 表示不做补偿；测出实际偏移后填进去（左偏为负、右偏为正）。
    # -------------------------------------------------------------------------
    corner_offset_m: 0.0

    # -------------------------------------------------------------------------
    #  距离解算模式
    #    pixel_height  —— Z = fy * 真实边长 / 像素边长
    #                     适合物块正对相机、距离较远的情况
    #    ground_plane  —— 用物块底边位置 + 相机俯角算距离
    #                     适合物块放在桌面上、相机固定俯视（实测更稳）
    # -------------------------------------------------------------------------
    distance_mode: "pixel_height"

    # ground_plane 模式专用：相机离桌面/地面高度 与 相机俯角
    cam_height_m: 0.35
    cam_pitch_deg: 30.0

    # -------------------------------------------------------------------------
    #  红/蓝 HSV 阈值（OpenCV 的 H 是 0~179）
    #  调法见 README：用 trackbar 版工具边拖边看
    #  S/V 下限用来滤掉"发白的红"和"发黑的蓝"
    # -------------------------------------------------------------------------
    red_h_low_max: 10
    red_h_high_min: 170
    red_s_min: 90
    red_v_min: 50

    blue_h_min: 95
    blue_h_max: 135
    blue_s_min: 90
    blue_v_min: 50

    # -------------------------------------------------------------------------
    #  分类阈值
    #  dominant_ratio : 单色占比 ≥ 此值 -> 判为纯色
    #  interleave_ratio : 红蓝相间时，每一色至少要占这么多
    #  layer_split_ratio : 上下分层检查的切分位置（0.5 = 对半切）
    #     ★ 不要调回 0.25：那样上下两层的面积比恒为 0.25/0.75 = 0.333，
    #       永远达不到下面的 layer_size_tol(0.45)，红蓝相间会永远判不出来。
    #  layer_size_tol : 上层的主色层 与 下层的主色层，规模要均衡到这个比例，
    #                   否则认为不是真分层，退化成占优的那一色
    #                   （用来滤掉"一整块红 + 边缘一点蓝色反光"）
    # -------------------------------------------------------------------------
    dominant_ratio: 0.80
    interleave_ratio: 0.18
    layer_split_ratio: 0.5
    layer_size_tol: 0.45

    # -------------------------------------------------------------------------
    #  预处理
    #  morph_kernel / blur_kernel 必须是奇数（脚本内部会强制 |1）
    #  光照噪点多就把 blur_kernel 调大；连通区域碎就把 morph_kernel 调大
    # -------------------------------------------------------------------------
    morph_kernel: 5
    blur_kernel: 5
    min_area_px: 200

    # -------------------------------------------------------------------------
    #  图像源
    #  image_path 非空 -> 静态图模式（题目允许从网上下载图片，这是最省事的验证方式）
    #  image_path 为空  -> 话题模式，订阅 image_raw / camera_info
    #
    #  WSL 里访问 Windows 文件的路径规则：C:\a\b.jpg  ->  /mnt/c/a/b.jpg
    # -------------------------------------------------------------------------
    image_path: ""
    # 话题发布频率目标（验收 60Hz 的核心参数）
    republish_hz: 60.0
    # 是否弹出窗口看图（调试时开，跑频率测试时关，弹窗会拖慢帧率）
    show_image: false

    # -------------------------------------------------------------------------
    #  相机内参兜底值：只有在收不到 /camera_info 时才用
    #  fx = fy ≈ 图像宽度（粗略估计），cx/cy = 图像中心
    # -------------------------------------------------------------------------
    fallback_fx: 600.0
    fallback_fy: 600.0
    fallback_cx: 320.0
    fallback_cy: 240.0
